name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Runner SDK may lack compileSdk 37.1; AGP auto-downloads it once licenses are accepted.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build, check, screenshots, coverage
        run: ./gradlew :app:assembleQaDebug :app:assembleQaRelease check verifyRoborazziDebug koverVerify --stacktrace

      - name: Test build-logic (included build)
        run: ./gradlew -p build-logic check --stacktrace

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          if-no-files-found: ignore
          path: |
            **/build/reports/**
            **/build/test-results/**
            **/build/outputs/roborazzi/**
