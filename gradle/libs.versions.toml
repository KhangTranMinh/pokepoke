# Version catalog `libs`: thư viện riêng của app (module tự khai báo).
# Mọi thứ build-logic đọc hoặc tự thêm nằm ở gradle/pokepoke.versions.toml (catalog `pokepoke`);
# mỗi artifact chỉ nằm ở đúng một trong hai file, `version.ref` chỉ trỏ [versions] cùng file.

[versions]
# AndroidX
coreKtx = "1.19.1"
coreSplashscreen = "1.2.0"
activityCompose = "1.13.0"
appcompat = "1.8.0"
datastore = "1.3.0"
startup = "1.2.0"

# Kotlin / network / image / security
javaxInject = "1"
retrofit = "3.0.0"
okhttp = "5.5.1"
coil = "3.6.3"
tink = "1.24.0"

# Test
espresso = "3.7.0"

[libraries]
# AndroidX
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-startup = { group = "androidx.startup", name = "startup-runtime", version.ref = "startup" }
androidx-compose-material3-navigation-suite = { group = "androidx.compose.material3", name = "material3-adaptive-navigation-suite" } # version từ Compose BOM

# Kotlin / network / image / security
javax-inject = { group = "javax.inject", name = "javax.inject", version.ref = "javaxInject" }
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-kotlinx-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver3", version.ref = "okhttp" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }
tink-android = { group = "com.google.crypto.tink", name = "tink-android", version.ref = "tink" }

# Test
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
