# Version catalog `coreLibs`: thư viện ngoài của module `:core:*` (dùng chung / sẽ publish cùng core, build.md §1.4, §11).
# build-logic KHÔNG đọc file này. Module khác core cũng dùng được khi cần (vd. `coreLibs.retrofit` ở :business:data).
# Mỗi artifact chỉ nằm ở đúng một trong ba file (pokepoke / coreLibs / libs), `version.ref` chỉ trỏ [versions] cùng file.

[versions]
datastore = "1.3.0"
javaxInject = "1"
retrofit = "3.0.0"
okhttp = "5.5.1"
tink = "1.24.0"

[libraries]
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
javax-inject = { group = "javax.inject", name = "javax.inject", version.ref = "javaxInject" }
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-kotlinx-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver3", version.ref = "okhttp" }
tink-android = { group = "com.google.crypto.tink", name = "tink-android", version.ref = "tink" }
